openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /reminders/status:
    get:
      operationId: getReminderStatus
      summary: Read the authorized house reminder cooldown using a visible chore
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: choreId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "200":
          description: Current reminder availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderStatus"
        "503":
          description: Cooldown storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
  /reminders:
    post:
      operationId: sendReminders
      summary: Forward server-resolved reminders at most once an hour per house
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: n8n confirmed delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResult"
        "400":
          description: Invalid reminder input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
        "429":
          description: An hourly reminder attempt has already been made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
        "502":
          description: n8n failed or returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
        "503":
          description: Reminders are not configured or cooldown storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
        "504":
          description: n8n response timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Unauthorized:
      description: Missing or invalid Supabase access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReminderError"
    Forbidden:
      description: Chore is not readable by the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReminderError"
    InvalidRequest:
      description: Invalid chore ID or request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReminderError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ReminderChore:
      type: object
      additionalProperties: false
      required: [title, due, overdue]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        due:
          type: string
          description: Local calendar date in YYYY-MM-DD format
          pattern: '^\d{4}-\d{2}-\d{2}$'
        overdue:
          type: boolean
    ReminderRecipient:
      type: object
      additionalProperties: false
      required: [name, email, chores]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        chores:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReminderChore"
    ReminderInput:
      type: object
      additionalProperties: false
      required: [choreId]
      properties:
        choreId:
          type: string
          format: uuid
        everyone:
          type: boolean
          default: false
          description: Include all unfinished assigned chores in the authorized chore's house.
        timeZone:
          type: string
          maxLength: 100
          description: IANA time zone used only to determine today's calendar date.
    ReminderStatus:
      type: object
      required: [configured, nextAllowedAt, serverNow]
      properties:
        configured:
          type: boolean
        nextAllowedAt:
          type: [string, "null"]
          format: date-time
        serverNow:
          type: string
          format: date-time
    ReminderResult:
      type: object
      required: [ok, sent, nextAllowedAt, serverNow]
      properties:
        ok:
          type: boolean
        sent:
          type: integer
          minimum: 0
        nextAllowedAt:
          type: string
          format: date-time
        serverNow:
          type: string
          format: date-time
    ReminderError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        nextAllowedAt:
          type: string
          format: date-time
        serverNow:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

